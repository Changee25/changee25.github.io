<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zaikai</title>
<meta name="description" content="I don't know where I'm going, but I'm on my way.">
<style>
  :root {
    --glow: #8fd6ff;
    --glow-2: #c9ecff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #04090f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f3f8ff;
  }

  .splash { position: fixed; inset: 0; overflow: hidden; }

  /* ===== 背景：暗场 + 中央微光 ===== */
  .sky {
    position: absolute;
    inset: -6%;
    background:
      radial-gradient(120% 82% at 50% 46%, #3079ba 0%, #1b5285 38%, #0f3355 68%, #071a2c 100%);
  }
  .blobs {
    position: absolute;
    inset: -25%;
    filter: blur(80px);
    opacity: .85;
    background:
      radial-gradient(30% 12% at 38% 14%, rgba(190, 230, 255, .38) 0%, rgba(190, 230, 255, 0) 70%),
      radial-gradient(24% 9% at 72% 22%, rgba(160, 215, 255, .26) 0%, rgba(160, 215, 255, 0) 70%),
      radial-gradient(44% 30% at 22% 74%, rgba(52, 130, 200, .55) 0%, rgba(52, 130, 200, 0) 66%),
      radial-gradient(40% 26% at 82% 68%, rgba(70, 150, 220, .45) 0%, rgba(70, 150, 220, 0) 64%);
  }

  /* 参考图里的竖向光束 */
  .beams {
    position: absolute;
    inset: 0;
    opacity: .68;
    filter: blur(5px);
    background-image: repeating-linear-gradient(
      90deg,
      rgba(130, 205, 255, 0) 0 54px,
      rgba(130, 205, 255, .3) 54px 56px,
      rgba(130, 205, 255, 0) 56px 110px
    );
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 24%, #000 76%, transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0%, #000 24%, #000 76%, transparent 100%);
  }

  /* 中央光晕，呼应参考图里汇聚的高光 */
  .halo {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(34% 24% at 50% 30%, rgba(150, 210, 255, .22) 0%, rgba(150, 210, 255, 0) 72%),
      radial-gradient(46% 30% at 50% 58%, rgba(90, 165, 235, .16) 0%, rgba(90, 165, 235, 0) 70%);
  }

  .veil {
    position: absolute;
    inset: 0;
    background: rgba(10, 28, 48, .16);
    backdrop-filter: blur(9px) saturate(125%);
    -webkit-backdrop-filter: blur(9px) saturate(125%);
  }
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: radial-gradient(120% 92% at 50% 44%, rgba(0, 0, 0, 0) 38%, rgba(4, 14, 26, .62) 100%);
  }

  /* ===== 五线谱素材（缓慢流动） ===== */
  .dec {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    user-select: none;
    will-change: translate;
    filter: drop-shadow(0 0 5px rgba(143, 214, 255, .5))
            drop-shadow(0 0 22px rgba(64, 150, 235, .38));
  }
  .dec--1 { width: 46vw; left: -9vw;   top: -3vw;  opacity: .42; animation: flowA 20s ease-in-out infinite alternate; }
  .dec--2 { width: 38vw; right: -9vw;  top: -4vw;  scale: -1 1; opacity: .26; animation: flowB 35s ease-in-out infinite alternate; }
  .dec--3 { width: 26vw; left: -5vw;   bottom: -4vw; opacity: .34; animation: flowB 23s ease-in-out infinite alternate; }
  .dec--4 { width: 22vw; right: -5vw;  bottom: -6vw; scale: -1 1; opacity: .22; animation: flowA 32s ease-in-out infinite alternate; }
  .dec--5 { width: 20vw; left: -11vw;  top: 36%;   opacity: .16; animation: flowA 26s ease-in-out infinite alternate; }
  .dec--6 { width: 30vw; right: -16vw; top: 50%;   scale: -1 1; opacity: .14; animation: flowB 29s ease-in-out infinite alternate; }

  @keyframes flowA {
    from { translate: -1vw 0; rotate: -1.5deg; }
    to   { translate: 3.5vw -2.4vh; rotate: 1.5deg; }
  }
  @keyframes flowB {
    from { translate: 1vw 0; rotate: 1.5deg; }
    to   { translate: -3.5vw 2.2vh; rotate: -1.5deg; }
  }

  /* ===== 谱号 ===== */
  .clef {
    position: absolute;
    z-index: 3;
    color: #d5eeff;
    font-family: "Segoe UI Symbol", "Noto Music", "Bravura", serif;
    line-height: 1;
    filter: drop-shadow(0 0 10px rgba(143, 214, 255, .9))
            drop-shadow(0 0 30px rgba(70, 160, 240, .55));
    animation: floaty 13s ease-in-out infinite;
    pointer-events: none;
  }
  .clef--a { left: 11%; top: 13%; font-size: 66px; opacity: .42; transform: rotate(-10deg); }
  .clef--b { right: 13%; bottom: 17%; font-size: 82px; opacity: .3; transform: rotate(9deg); animation-delay: -6s; }

  /* ===== 音符（28 个，缓慢浮游） ===== */
  .note {
    position: absolute;
    z-index: 3;
    color: #e2f4ff;
    text-shadow: 0 0 8px rgba(143, 214, 255, .95), 0 0 26px rgba(70, 160, 240, .7);
    animation: drift 11s ease-in-out infinite;
    pointer-events: none;
    will-change: translate, opacity;
  }
  @keyframes drift {
    0%, 100% { translate: 0 0; opacity: .28; }
    50% { translate: 5px -28px; opacity: .95; }
  }
  @keyframes driftB {
    0%, 100% { translate: 0 12px; opacity: .22; }
    50% { translate: 12px -24px; opacity: .86; }
  }
  @keyframes floaty {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -12px; }
  }

  /* ===== 内容 ===== */
  .stage { position: relative; z-index: 5; height: 100%; }

  .welcome {
    position: absolute;
    top: 25%;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
    font-weight: 400;
    font-size: clamp(17px, 2.9vw, 26px);
    letter-spacing: .52em;
    text-indent: .52em;
    color: #eef8ff;
    text-shadow: 0 0 18px rgba(120, 195, 255, .55);
    opacity: 1;
    animation: fadeUp 1.2s ease .25s both;
  }
  .welcome::after {
    content: "";
    display: block;
    width: 64px;
    height: 1px;
    margin: 20px auto 0;
    background: linear-gradient(90deg, transparent, rgba(180, 225, 255, .9), transparent);
    box-shadow: 0 0 12px rgba(120, 195, 255, .8);
  }

  .typed {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translateX(-50%);
    width: min(760px, 88vw);
    margin: 0;
    text-align: center;
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    font-style: italic;
    font-size: clamp(19px, 2.9vw, 30px);
    line-height: 1.75;
    color: #f6faff;
    text-shadow: 0 0 26px rgba(110, 185, 255, .45), 0 2px 24px rgba(0, 20, 40, .7);
    min-height: 2em;
  }

  .typed .w {
    display: inline-block;
    white-space: nowrap;
  }

  .typed .ch {
    display: inline-block;
    opacity: 0;
    -webkit-filter: blur(6px);
    filter: blur(6px);
    animation: bloom 260ms cubic-bezier(.215, .61, .355, 1) forwards;
  }

  @keyframes bloom {
    from { opacity: 0; filter: blur(6px); -webkit-filter: blur(6px); transform: translateY(3px); }
    to   { opacity: 1; filter: blur(0);   -webkit-filter: blur(0);   transform: none; }
  }

  .caret {
    display: inline-block;
    width: 2px;
    height: .95em;
    margin-left: 3px;
    vertical-align: -.1em;
    background: #d7efff;
    box-shadow: 0 0 10px rgba(143, 214, 255, .95);
    opacity: 0;
  }
  body.typed-done .caret {
    opacity: 1;
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .actions {
    position: absolute;
    top: 70%;
    left: 0;
    right: 0;
    text-align: center;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .9s ease, transform .9s ease;
    pointer-events: none;
  }
  .actions.show { opacity: 1; transform: none; pointer-events: auto; }

  .enter {
    display: inline-block;
    padding: 13px 40px;
    border: 1px solid rgba(170, 220, 255, .55);
    border-radius: 999px;
    background: rgba(140, 200, 255, .08);
    color: #f2f9ff;
    font-size: 15px;
    letter-spacing: .22em;
    text-indent: .22em;
    text-decoration: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 22px rgba(90, 170, 240, .35), inset 0 0 18px rgba(140, 200, 255, .12);
    transition: background .3s ease, transform .3s ease, box-shadow .3s ease;
  }
  .enter:hover {
    background: rgba(150, 205, 255, .2);
    transform: translateY(-2px);
    box-shadow: 0 0 32px rgba(110, 190, 255, .55), inset 0 0 22px rgba(160, 215, 255, .2);
  }
  .enter .arrow { margin-left: 8px; text-indent: 0; }
  .hint {
    margin: 16px 0 0;
    font-size: 12px;
    letter-spacing: .16em;
    color: rgba(200, 228, 250, .5);
  }

  @keyframes fadeUp {
    from { opacity: .35; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  @media (max-width: 640px) {
    .welcome { top: 22%; letter-spacing: .38em; text-indent: .38em; }
    .typed { top: 50%; }
    .actions { top: 68%; }
    .dec--1, .dec--2 { width: 96vw; }
    .dec--5, .dec--6 { display: none; }
    .dec--3, .dec--4 { width: 58vw; }
    .clef--a { font-size: 46px; }
    .clef--b { font-size: 54px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .note, .clef { animation: none; }
    .welcome { animation: none; opacity: 1; }
  }
  html.static .welcome { animation: none; opacity: 1; }
  /* fade out before navigating */
  .splash { transition: opacity .36s ease; }
  body.leaving .splash { opacity: 0; }
</style>
</head>

<script>
(function () {
  var LINE = "I don't know where I'm going, but I'm on my way.";
  var STAGGER = 120;   // 相邻字错开 120ms，与 260ms 化开叠加成波纹
  var DUR = 260;      // 单字从 blur(6px) 化开所需时间
  var out = document.getElementById('text');
  var actions = document.getElementById('actions');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var staticMode = /[?&]static=1/.test(window.location.search);
  var leaving = false;

  out.textContent = '';

  function showEnter() {
    actions.classList.add('show');
    document.body.classList.add('typed-done');
  }

  function build(delay) {
    var idx = 0;
    LINE.split(' ').forEach(function (word, wi) {
      if (wi > 0) {
        out.appendChild(document.createTextNode(' '));
        idx += 1;
      }
      var w = document.createElement('span');
      w.className = 'w';
      word.split('').forEach(function (ch) {
        var s = document.createElement('span');
        s.className = 'ch';
        s.textContent = ch;
        s.style.animationDelay = (delay + idx * STAGGER) + 'ms';
        s.addEventListener('animationend', function (ev) {
          var t = ev.target;
          t.style.animation = 'none';
          t.style.opacity = '1';
          t.style.filter = 'none';
          t.style.webkitFilter = 'none';
          t.style.transform = 'none';
        });
        w.appendChild(s);
        idx += 1;
      });
      out.appendChild(w);
    });
    return delay + (idx - 1) * STAGGER + DUR;
  }

  if (staticMode) { document.documentElement.classList.add('static'); }

  if (reduced) {
    out.textContent = LINE;
    showEnter();
  } else if (staticMode) {
    build(0);
    showEnter();
  } else {
    var done = build(730);
    setTimeout(showEnter, done + 380);
  }

  function go() {
    if (leaving) return;
    leaving = true;
    if (reduced) {
      window.location.href = 'blog/';
      return;
    }
    document.body.classList.add('leaving');
    setTimeout(function () { window.location.href = 'blog/'; }, 340);
  }

  var enterLink = document.querySelector('.enter');
  if (enterLink) {
    enterLink.addEventListener('click', function (e) {
      e.preventDefault();
      go();
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      go();
    }
  });
})();
</script>
