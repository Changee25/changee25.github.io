title: Ch4ng3e25 的博客
description: 生活随笔，例会心得，学习笔记
author: Changee25
email: ""

# 站点地址：结尾不要加 /
url: "https://changee25.github.io"
# 这是用户名仓库，根路径，所以 baseurl 必须留空
baseurl: ""

theme: minima
show_excerpts: true
header_pages:
  - blog.md
  - diary.md
  - links.md
  - about.md

lang: zh-CN
timezone: Asia/Shanghai

permalink: /:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
