<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <meta name="theme-color" content="#c7e3fa">

  <style>
    /* ---------- 页面切换淡入淡出 ---------- */
    @view-transition { navigation: auto; }
    @media (prefers-reduced-motion: no-preference) {
      ::view-transition-old(root) { animation: 160ms ease both vt-out; }
      ::view-transition-new(root) { animation: 240ms ease both vt-in; }
    }
    @keyframes vt-out { to { opacity: 0; } }
    @keyframes vt-in { from { opacity: 0; } }

    /* ---------- 文章目录 ---------- */
    .toc {
      position: fixed;
      top: 120px;
      right: 24px;
      box-sizing: border-box;
      width: 232px;
      max-height: 74vh;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.6;
      display: none;
      scrollbar-width: thin;
      padding: 16px 14px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 28px rgba(30, 90, 140, 0.06);
    }
    @media (min-width: 1340px) {
      .toc {
        display: block;
        /* 贴着正文外侧，但最多离右边 72px，宽屏不会飘太远 */
        right: clamp(28px, calc((100vw - 780px) / 2 - 258px), 72px);
      }
    }

    .toc-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .04em;
      color: #16324f;
    }
    .toc-head svg { width: 17px; height: 17px; flex: none; }

    .toc ul { list-style: none; margin: 0; padding: 0; }
    .toc li { position: relative; }

    .toc a {
      display: block;
      padding: 5px 6px 5px 14px;
      color: #3d5670;
      text-decoration: none;
      border-bottom: none;
      border-left: 2.5px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .16s ease, border-color .16s ease;
    }
    .toc a:hover { color: #1f6fb2; }
    .toc a.active {
      color: #1f6fb2;
      border-left-color: #1f6fb2;
      font-weight: 600;
    }

    .toc li.has-sub > a { padding-left: 18px; }

    .toc ul.sub { margin: 1px 0 6px; }
    .toc ul.sub a {
      padding-left: 30px;
      font-size: 13px;
      color: #56707f;
    }
    .toc ul.sub a.active { color: #1f6fb2; }

    .toc .toggle {
      position: absolute;
      left: -1px;
      top: 7px;
      z-index: 1;
      width: 13px;
      height: 13px;
      padding: 0;
      border: 0;
      background: none;
      color: #7c93a8;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      transition: transform .18s ease, color .18s ease;
    }
    .toc .toggle:hover { color: #1f6fb2; }
    .toc li.collapsed .toggle { transform: rotate(-90deg); }
    .toc li.collapsed ul.sub { display: none; }

    /* ---------- 评论区 ---------- */
    .comments {
      margin-top: 3em;
      padding-top: 26px;
      border-top: 1px dashed rgba(31, 111, 178, .18);
    }
    .comments-title {
      margin: 0 0 18px;
      font-size: 1.05em;
      letter-spacing: .06em;
      color: #123a5c;
    }
    .comments-tip {
      padding: 16px 18px;
      font-size: 13px;
      line-height: 1.8;
      color: #4a6b8a;
      background: rgba(255, 255, 255, .62);
      border: 1px dashed rgba(31, 111, 178, .24);
      border-radius: 10px;
    }
  
    /* ---------- 代码块：浅底 + 深字，Rouge 的 token 才看得见 ---------- */
    .highlight,
    .highlighter-rouge .highlight {
      background: #eaf2fb;
      border-radius: 10px;
    }

    pre {
      background: #eaf2fb;
      border: 1px solid rgba(31, 111, 178, 0.14);
      border-radius: 10px;
    }

    pre code,
    .highlight code,
    .highlight pre {
      background: none;
      border: 0;
      color: #24303d;
    }

    .highlight .err {
      background: transparent !important;
      color: #b3261e;
    }

    .highlight pre {
      margin: 0;
      padding: 1em 1.2em;
    }

    /* ---------- 背景稍微加深，别一片惨白 ---------- */
    html {
      background: linear-gradient(180deg, #b9daf7 0%, #d3e9fd 34%, #e6f3ff 68%, #f4faff 100%) !important;
    }

    /* ---------- 章节折叠 ---------- */
    .post-content h2 {
      cursor: pointer;
      user-select: none;
      position: relative;
      padding-left: 20px;
    }

    .post-content h2::before {
      content: "\25B8";
      position: absolute;
      left: 0;
      top: 0.15em;
      font-size: 0.75em;
      color: #1f6fb2;
      transition: transform 0.2s ease;
    }

    section.sec.open > h2::before {
      transform: rotate(90deg);
    }

    section.sec > h2 {
      margin-top: 1.3em;
    }

    section.sec:first-of-type > h2 {
      margin-top: 0.4em;
    }

    section.sec > .sec-body {
      display: none;
    }

    section.sec.open > .sec-body {
      display: block;
    }

    .sec-hint {
      margin: 0 0 1.6em;
      font-size: 13px;
      color: #6b8aa6;
    }

    .comments .share-bar {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
      margin-bottom: 20px;
    }

    /* 文章大标题小一号（minima 默认 42px） */
    .post-title {
      font-size: 34px;
      line-height: 1.25;
    }

    @media screen and (max-width: 800px) {
      .post-title { font-size: 28px; }
    }

</style>

  <!-- 悬停预渲染 -->
  <script type="speculationrules">
  { "prerender": [ { "where": { "href_matches": "/*" }, "eagerness": "moderate" } ] }
  </script>

  <script>
  document.addEventListener('DOMContentLoaded', function () {

    /* 只有文章页才有 h-entry；page 布局只有 article.post，靠这个区分 */
    var article = document.querySelector('article.post.h-entry');
    if (!article) return;

    var content = article.querySelector('.post-content');
    if (!content) return;

    /* ============================================================
       1. 目录（TOC）
       ============================================================ */
    (function buildToc() {
      var heads = content.querySelectorAll('h2, h3');
      if (heads.length < 2) return;

      function slug(text, i) {
        var t = (text || '').trim().toLowerCase()
          .replace(/[^\w\u4e00-\u9fa5-]+/g, '-')
          .replace(/^-+|-+$/g, '');
        return 'sec-' + (t || i);
      }

      /* 按 h2 分组，h3 挂到上一组下面 */
      var groups = [];
      for (var i = 0; i < heads.length; i++) {
        var h = heads[i];
        if (!h.id) h.id = slug(h.textContent, i);
        if (h.tagName === 'H2') {
          groups.push({ h2: h, subs: [] });
        } else if (groups.length) {
          groups[groups.length - 1].subs.push(h);
        } else {
          groups.push({ h2: null, subs: [h] });
        }
      }

      var nav = document.createElement('aside');
      nav.className = 'toc';
      nav.setAttribute('aria-label', '目录');

      var head = document.createElement('p');
      head.className = 'toc-head';
      head.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
        'stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>' +
        '<path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>' +
        '<span>目录</span>';
      nav.appendChild(head);

      function link(h) {
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.title = h.textContent;
        return a;
      }

      var root = document.createElement('ul');

      for (var g = 0; g < groups.length; g++) {
        var grp = groups[g];
        var li = document.createElement('li');

        if (grp.h2) {
          if (grp.subs.length) {
            li.className = 'has-sub';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'toggle';
            btn.setAttribute('aria-label', '展开或折叠');
            btn.textContent = '\u25BE';
            (function (target) {
              btn.addEventListener('click', function () {
                target.classList.toggle('collapsed');
              });
            })(li);
            li.appendChild(btn);
          }
          li.appendChild(link(grp.h2));
        }

        if (grp.subs.length) {
          var sub = document.createElement('ul');
          sub.className = 'sub';
          for (var k = 0; k < grp.subs.length; k++) {
            var sli = document.createElement('li');
            sli.appendChild(link(grp.subs[k]));
            sub.appendChild(sli);
          }
          li.appendChild(sub);
        }

        root.appendChild(li);
      }

      nav.appendChild(root);
      document.body.appendChild(nav);

      /* 滚动高亮 */
      var links = nav.querySelectorAll('a');
      var byId = {};
      for (var j = 0; j < links.length; j++) {
        byId[links[j].getAttribute('href').slice(1)] = links[j];
      }

      function setActive(id) {
        var cur = nav.querySelector('a.active');
        if (cur) cur.classList.remove('active');
        if (byId[id]) {
          byId[id].classList.add('active');
          var parentLi = byId[id].closest('li.has-sub');
          if (parentLi) parentLi.classList.remove('collapsed');
        }
      }

      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (en.isIntersecting) setActive(en.target.id);
          });
        }, { rootMargin: '-12% 0px -72% 0px', threshold: [0, 1] });
        for (var m = 0; m < heads.length; m++) io.observe(heads[m]);
      }
    })();

    /* ============================================================
       1.5 章节折叠：默认只显示标题，点标题展开
       ============================================================ */
    (function accordion() {
      var heads = content.querySelectorAll('h2');
      if (heads.length < 2) return;

      var hint = document.createElement('p');
      hint.className = 'sec-hint';
      hint.textContent = '点标题展开／收起这一节';
      var first = heads[0];
      first.parentNode.insertBefore(hint, first);

      for (var i = 0; i < heads.length; i++) {
        var h = heads[i];
        var sec = document.createElement('section');
        sec.className = 'sec';
        h.parentNode.insertBefore(sec, h);

        var body = document.createElement('div');
        body.className = 'sec-body';

        var n = h.nextSibling;
        while (n && !(n.nodeType === 1 && n.tagName === 'H2')) {
          var next = n.nextSibling;
          body.appendChild(n);
          n = next;
        }

        sec.appendChild(h);
        sec.appendChild(body);

        (function (target) {
          target.querySelector('h2').addEventListener('click', function (e) {
            if (e.target.tagName === 'A') return;
            target.classList.toggle('open');
          });
        })(sec);
      }

      function openByHash() {
        var id = decodeURIComponent(location.hash.replace('#', ''));
        if (!id) return;
        var target = document.getElementById(id);
        if (!target) return;
        var sec = target.closest('section.sec');
        if (sec) sec.classList.add('open');
      }

      openByHash();
      window.addEventListener('hashchange', openByHash);

      /* 点目录时先展开再跳转 */
      document.addEventListener('click', function (e) {
        var a = e.target.closest ? e.target.closest('.toc a') : null;
        if (!a) return;
        var id = decodeURIComponent(a.getAttribute('href').replace('#', ''));
        var t = document.getElementById(id);
        var sec = t && t.closest ? t.closest('section.sec') : null;
        if (sec) sec.classList.add('open');
      });
    })();

    /* ============================================================
       2. 复制链接按钮
       ============================================================ */
    (function buildShare() {
      var bar = document.createElement('div');
      bar.className = 'share-bar';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'share-btn';
      btn.textContent = '复制本文链接';

      var tip = document.createElement('span');
      tip.className = 'share-tip';

      function flash(text) {
        tip.textContent = text;
        btn.classList.add('is-done');
        setTimeout(function () {
          tip.textContent = '';
          btn.classList.remove('is-done');
        }, 1800);
      }

      function legacy(url) {
        var t = document.createElement('textarea');
        t.value = url;
        t.setAttribute('readonly', '');
        t.style.position = 'fixed';
        t.style.opacity = '0';
        document.body.appendChild(t);
        t.select();
        try { document.execCommand('copy'); flash('已复制'); }
        catch (e) { flash('复制失败，请手动复制地址栏'); }
        document.body.removeChild(t);
      }

      btn.addEventListener('click', function () {
        var url = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () { flash('已复制'); },
                                                  function () { legacy(url); });
        } else {
          legacy(url);
        }
      });

      bar.appendChild(btn);
      bar.appendChild(tip);
      content.parentNode.insertBefore(bar, content.nextSibling);
    })();

    /* ============================================================
       3. giscus 评论
       —— 只改下面这两个值，其余不用动
       ============================================================ */
    var GISCUS = {
      repo: 'Changee25/changee25.github.io',
      repoId: 'R_kgDOVW185w',
      category: 'Announcements',
      categoryId: 'DIC_kwDOVW18584DJthh',
      mapping: 'pathname',
      theme: 'light'
    };

    (function buildComments() {
      /* 保险：description 太长会让 giscus 的 iframe 地址超限（URI_TOO_LONG），先截短 */
      var metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) {
        var dc = metaDesc.getAttribute('content') || '';
        if (dc.length > 200) {
          metaDesc.setAttribute('content', dc.slice(0, 160).replace(/\s+/g, ' ') + '…');
        }
      }

      var box = document.createElement('section');
      box.className = 'comments';

      var h2 = document.createElement('h2');
      h2.className = 'comments-title';
      h2.textContent = '互动区';
      box.appendChild(h2);

      /* 把上面的「复制本文链接」挪进来，和评论合成一个互动区 */
      var shareBar = document.querySelector('.share-bar');
      if (shareBar && shareBar.parentNode) {
        box.appendChild(shareBar);
      }

      if (!GISCUS.categoryId) {
        var tip = document.createElement('div');
        tip.className = 'comments-tip';
        tip.innerHTML =
          '评论区还没配置好。去 <a href="https://giscus.app" target="_blank" rel="noopener">giscus.app</a> ' +
          '选好仓库和分类，把生成的 <code>data-category-id</code> 填进 ' +
          '<code>_includes/head.html</code> 的 <code>categoryId</code> 就行。';
        box.appendChild(tip);
      } else {
        var script = document.createElement('script');
        script.src = 'https://giscus.app/client.js';
        script.setAttribute('data-repo', GISCUS.repo);
        script.setAttribute('data-repo-id', GISCUS.repoId);
        script.setAttribute('data-category', GISCUS.category);
        script.setAttribute('data-category-id', GISCUS.categoryId);
        script.setAttribute('data-mapping', GISCUS.mapping);
        script.setAttribute('data-strict', '0');
        script.setAttribute('data-reactions-enabled', '1');
        script.setAttribute('data-emit-metadata', '0');
        script.setAttribute('data-input-position', 'top');
        script.setAttribute('data-theme', GISCUS.theme);
        script.setAttribute('data-lang', 'zh-CN');
        script.setAttribute('data-loading', 'lazy');
        script.crossOrigin = 'anonymous';
        script.async = true;
        box.appendChild(script);
      }

      var anchor = content.nextSibling;
      if (anchor && anchor.nextSibling) anchor = anchor.nextSibling;
      content.parentNode.insertBefore(box, anchor || null);
    })();
  });
  </script>

{% if page.lock %}
  <style>
    html.lock-check .page-content { visibility: hidden; }

    .lock-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #c7e3fa 0%, #e6f3fe 52%, #f6fbff 100%);
      padding: 20px;
    }

    .lock-card {
      width: min(420px, 88vw);
      padding: 34px 30px 26px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(30, 90, 140, 0.18);
    }

    .lock-card h2 {
      margin: 0 0 10px;
      font-size: 1.25em;
      color: #123a5c;
    }

    .lock-card p {
      margin: 0;
      font-size: 0.94em;
      color: #4a6b8a;
    }

    .lock-form { display: flex; gap: 8px; margin-top: 20px; }

    .lock-input {
      flex: 1;
      min-width: 0;
      padding: 10px 16px;
      font-size: 15px;
      font-family: inherit;
      color: #123a5c;
      background: #fff;
      border: 1px solid rgba(31, 111, 178, 0.24);
      border-radius: 999px;
      outline: none;
      transition: border-color .2s ease;
    }
    .lock-input:focus { border-color: #1f6fb2; }

    .lock-btn {
      padding: 10px 22px;
      font-size: 15px;
      font-family: inherit;
      font-weight: 600;
      color: #fff;
      background: #1f6fb2;
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }
    .lock-btn:hover { background: #1a5f9c; }

    .lock-err {
      min-height: 1.5em;
      margin: 12px 0 0;
      font-size: 0.86em;
      color: #c0392b;
    }

    .lock-card.shake { animation: lock-shake .36s ease; }
    @keyframes lock-shake {
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }
  </style>

  <script>
  document.documentElement.classList.add('lock-check');

  document.addEventListener('DOMContentLoaded', function () {
    var HASH = '{{ page.lock_hash | default: "0026dfa9677472300020fb4ca90df0cf593f3f93de9acb6e918a856f5d39bd43" }}';
    var KEY = 'unlock:' + location.pathname;

    try {
      if (sessionStorage.getItem(KEY) === HASH) {
        document.documentElement.classList.remove('lock-check');
        return;
      }
    } catch (e) {}

    var ov = document.createElement('div');
    ov.className = 'lock-overlay';
    ov.innerHTML =
      '<div class="lock-card">' +
        '<h2>要密码才能看</h2>' +
        '<p>这个页面加密了，输入密码查看。</p>' +
        '<form class="lock-form">' +
          '<input class="lock-input" type="password" placeholder="密码" autocomplete="current-password">' +
          '<button class="lock-btn" type="submit">进入</button>' +
        '</form>' +
        '<p class="lock-err"></p>' +
      '</div>';
    document.body.appendChild(ov);

    var card = ov.querySelector('.lock-card');
    var form = ov.querySelector('.lock-form');
    var input = ov.querySelector('.lock-input');
    var err = ov.querySelector('.lock-err');

    input.focus();

    function hex(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
    }

    function wrong(msg) {
      err.textContent = msg;
      card.classList.add('shake');
      setTimeout(function () { card.classList.remove('shake'); }, 420);
      input.value = '';
      input.focus();
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!(window.crypto && crypto.subtle)) {
        err.textContent = '请用 https 地址打开这个页面';
        return;
      }
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(input.value)).then(function (buf) {
        if (hex(buf) === HASH) {
          try { sessionStorage.setItem(KEY, HASH); } catch (e2) {}
          document.documentElement.classList.remove('lock-check');
          ov.style.transition = 'opacity .35s ease';
          ov.style.opacity = '0';
          setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 380);
        } else {
          wrong('密码不正确，请重新输入');
        }
      });
    });
  });
  </script>

  <noscript>
    <style>html.lock-check .page-content { visibility: visible; }</style>
  </noscript>
{% endif %}
</head>
