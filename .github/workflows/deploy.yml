# 源码推到 src 分支 -> 云端自动构建 -> 发布到 main 分支（GitHub Pages 读的就是 main）
#
# 这样本机不需要装 Node.js：你在 Typora 写完 md，用 GitHub Desktop 提交并推送 src 即可。
name: 构建并发布博客

on:
  push:
    branches: [src]
  workflow_dispatch: # 也可以在 Actions 页面手动点一下重跑

permissions:
  contents: write

concurrency:
  group: blog-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 固定时区，避免「只写日期的 date: 」在云端按 UTC 算成前一天
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --no-audit --no-fund

      - name: 修复 front matter（模板复制丢了 --- 时自动补上）
        run: node tools/repair-front-matter.js

      - name: 检查正文里有没有本机路径图片
        run: |
          files=$(grep -rIl -e 'C:\\Users' -e 'file:///' source/_posts || true)
          if [ -n "$files" ]; then
            echo "::warning::以下文章引用了本机路径图片，网站上会显示不出来。请在本地双击「整理图片.bat」后再提交："
            echo "$files"
            {
              echo "### ⚠️ 图片路径有问题"
              echo ""
              echo "这些文章引用了本机路径图片（如 \`C:\\Users\\...\`），网站上会显示不出来："
              echo '```'
              echo "$files"
              echo '```'
              echo "**修法**：本地双击 \`整理图片.bat\`（会把图片复制进仓库并改写路径），然后重新 Commit + Push。"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "图片路径检查通过"
          fi

      - name: 构建静态文件
        run: |
          npx hexo clean
          npx hexo generate
          ls -la public | head -20

      - name: 发布到 main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./public
          # 每次都用孤儿提交强制覆盖：main 只放构建产物，
          # 这样即使 main 被别的仓库/误操作覆盖过，也能一次重建回来
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
