<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <meta name="theme-color" content="#216aa3">

  <!-- 页面之间淡入淡出（Chrome / Edge / Safari 18+，其他浏览器自动忽略） -->
  <style>
    @view-transition { navigation: auto; }

    @media (prefers-reduced-motion: no-preference) {
      ::view-transition-old(root) { animation: 160ms ease both vt-out; }
      ::view-transition-new(root) { animation: 240ms ease both vt-in; }
    }

    @keyframes vt-out { to { opacity: 0; } }
    @keyframes vt-in { from { opacity: 0; } }
  </style>

  <!-- 鼠标悬停时预渲染目标页，点击后几乎瞬间打开 -->
  <script type="speculationrules">
  {
    "prerender": [
      { "where": { "href_matches": "/*" }, "eagerness": "moderate" }
    ]
  }
  </script>

  <!-- 文章底部的“复制链接”按钮 -->
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var article = document.querySelector('article.post');
    if (!article) return;
    var content = article.querySelector('.post-content');
    if (!content) return;

    var bar = document.createElement('div');
    bar.className = 'share-bar';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'share-btn';
    btn.textContent = '复制本文链接';

    var tip = document.createElement('span');
    tip.className = 'share-tip';

    function flash(text) {
      tip.textContent = text;
      btn.classList.add('is-done');
      setTimeout(function () {
        tip.textContent = '';
        btn.classList.remove('is-done');
      }, 1800);
    }

    function legacyCopy(url) {
      var t = document.createElement('textarea');
      t.value = url;
      t.setAttribute('readonly', '');
      t.style.position = 'fixed';
      t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      try {
        document.execCommand('copy');
        flash('已复制');
      } catch (e) {
        flash('复制失败，请手动复制地址栏');
      }
      document.body.removeChild(t);
    }

    btn.addEventListener('click', function () {
      var url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
          flash('已复制');
        }, function () {
          legacyCopy(url);
        });
      } else {
        legacyCopy(url);
      }
    });

    bar.appendChild(btn);
    bar.appendChild(tip);
    content.parentNode.insertBefore(bar, content.nextSibling);
  });
  </script>
</head>
